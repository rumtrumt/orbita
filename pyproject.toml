[project]
name = "orbita"
version = "0.9.0"
description = "Голосовой ассистент для личных задач, напоминаний и встреч на русском языке"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "av>=12",
    "edge-tts>=6.1",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "num2words>=0.5.13",
    "numpy>=1.26",
    "piper-tts>=1.2",
    "platformdirs>=4.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Библиотеки CUDA для Whisper на GPU NVIDIA. Без них он работает на CPU.
gpu = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9.1"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "playwright>=1.45",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-python-dateutil",
]

[project.scripts]
orbita = "orbita.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbita"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "PTH", "DTZ", "S"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ"]
# Текст промпта читается как документ, переносы его только испортят.
"src/orbita/nlu/llm.py" = ["E501"]
# Фабрика приложения: маршруты замкнуты на контейнер зависимостей.
"src/orbita/api/app.py" = ["PLR0915"]
"evals/**" = ["S", "PLR", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["orbita"]

[[tool.mypy.overrides]]
module = ["pymorphy3.*", "faster_whisper.*", "fastembed.*", "piper.*", "edge_tts.*", "num2words.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "llm: требует запущенную LLM (Ollama)",
    "voice: требует загруженные голосовые модели",
]
